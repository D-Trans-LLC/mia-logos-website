<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Mia Logos</title>

  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #fafafa;
      color: #181d27;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .card {
      max-width: 640px;
      margin: 24px;
      padding: 48px;
      background: #ffffff;
      border: 1px solid #e9eaeb;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(24, 29, 39, 0.08);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 2.4rem;
    }

    p {
      color: #5f6877;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 24px;
      border-radius: 999px;
      background: #2596ff;
      color: white;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Thank you.</h1>

    <p>
      Your request has been received. A member of the Mia Logos team will be in touch shortly.
    </p>

    <a href="/">
      Return to Mia Logos
    </a>
  </div>
</body>
</html>
